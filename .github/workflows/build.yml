name: build-munch

# Builds every image for the Redmi K40S (munch) port on a macOS runner and
# publishes them as a GitHub Release plus per-run artifacts.
#
# The device code lives in WuBarlynn/unixnu-munch; this repository only holds
# the pipeline, the fixed inputs and the produced images.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Which images to build"
        type: choice
        options:
          - all
          - kernel
          - kernel-payload
          - boot-image
          - firmware
        default: all
      userdata:
        description: "Also build the userdata image (needs ~20 GB free; may exceed the hosted runner disk)"
        type: boolean
        default: false
      ipsw_url:
        description: "Override the IPSW URL (empty uses the OS profile)"
        type: string
        default: ""
      release:
        description: "Publish a GitHub Release with the images"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: build-munch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVICE_REPO: WuBarlynn/unixnu-munch
  DEVICE_REF: main
  # A tag ending in -ud builds the userdata image as well, so the whole set can be
  # produced without the manual dispatch form.
  WANT_USERDATA: ${{ (inputs.userdata || contains(github.ref_name, '-ud')) && 'true' || 'false' }}
  UNIXNU_REPO: FFT-infra/UniXNU
  # Pinned: upstream HEAD bddf670 pins a drivers/GopFramebuffer commit that is not public.
  UNIXNU_REF: 476ada3f2dc7d764e57ef9bac014f14342c30360
  UEFI_REPO: FFT-infra/uefi-alioth
  UEFI_REF: main
  DEVICE_NAME: munch
  DEFCONFIG: munch_defconfig
  IPSW_NAME: iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout the pipeline repository
        uses: actions/checkout@v4

      - name: Checkout the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEVICE_REPO }}
          ref: ${{ env.DEVICE_REF }}
          path: device
          submodules: recursive

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIXNU_REPO }}
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive

      - name: Checkout the Mu-Silicium base firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UEFI_REPO }}
          ref: ${{ env.UEFI_REF }}
          path: uefi
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$XCODE_APP" ] || XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          df -h "$GITHUB_WORKSPACE"

      - name: Apply the munch UEFI platform
        run: |
          chmod +x device/uefi/apply.sh
          device/uefi/apply.sh "$GITHUB_WORKSPACE/uefi"

      - name: Resolve the configuration
        working-directory: UniXNU
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE/device"


      - name: Restore the source cache
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('device/unixnu.lock') }}-${{ github.run_id }}
          restore-keys: |
            feeds-${{ hashFiles('device/unixnu.lock') }}-

      - name: Restore the kernel build cache
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/out/munch/ipados-17.7.11-21H461/munch/tree/build
          key: kbuild-${{ hashFiles('device/unixnu.lock', 'device/board.toml', 'device/configs/munch_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            kbuild-${{ hashFiles('device/unixnu.lock', 'device/board.toml', 'device/configs/munch_defconfig') }}-

      - name: Fetch sources
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch

      - name: Assemble the build tree
        working-directory: UniXNU
        run: |
          ./unixnu status --json | tee "$GITHUB_WORKSPACE/status.json"
          ./unixnu tree

      - name: Fetch the IPSW volumes over HTTP ranges
        if: ${{ !(inputs.steps == 'kernel' || inputs.steps == 'firmware') }}
        working-directory: UniXNU
        run: |
          set -o pipefail
          ./unixnu ipsw fetch OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee "$RUNNER_TEMP/ipsw.log" || {
            echo "::error::ipsw fetch failed: $(tail -3 "$RUNNER_TEMP/ipsw.log" | tr '\n' ' ')"
            exit 1
          }

      - name: Build the trust cache bundle
        if: ${{ !(inputs.steps == 'kernel' || inputs.steps == 'firmware') }}
        working-directory: UniXNU
        run: |
          VOL=.cache/firmware/target-volumes
          mkdir -p "$VOL"
          python3 "$GITHUB_WORKSPACE/scripts/prepare-trust-module.py" \
            out/ipsw/21H461/044-76040-038.dmg.trustcache "$VOL/static-trustcache.bin" \
            da88460e6e513438d5307e5c526f76497a74754476a24da29f239f0c90120fc2
          python3 "$GITHUB_WORKSPACE/scripts/prepare-trust-module.py" \
            out/ipsw/21H461/044-76034-038.dmg.trustcache "$VOL/system-trustcache.bin" \
            d121ba89167e03aafd00fa687c30cd8ebc4ccafd10c1408adb2ba3de12403651
          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path
          vol = Path('.cache/firmware/target-volumes')
          static = (vol / 'static-trustcache.bin').read_bytes()
          system = (vol / 'system-trustcache.bin').read_bytes()
          bundle = struct.pack('<3I', 2, 12, 12 + len(static)) + static + system
          out = Path('build/original-static-system-trust')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'original-static-system.bundle').write_bytes(bundle)
          print('bundle sha256', hashlib.sha256(bundle).hexdigest())
          PY

      - name: Prepare the Data seed
        if: ${{ !(inputs.steps == 'kernel' || inputs.steps == 'firmware') }}
        working-directory: UniXNU
        run: |
          set -o pipefail
          OS_DMG=$(ls out/ipsw/21H461/044-76040-038.dmg | head -n 1)
          mkdir -p .cache/firmware/target-volumes/os-mount
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint .cache/firmware/target-volumes/os-mount "$OS_DMG" \
            2>&1 | tee "$RUNNER_TEMP/attach.log" || {
            echo "::error::hdiutil attach failed: $(tail -3 "$RUNNER_TEMP/attach.log" | tr '\n' ' ')"
            exit 1
          }
          python3 scripts/prepare-owner-data-fixture.py \
            2>&1 | tee "$RUNNER_TEMP/seed.log" || {
            echo "::error::Data seed failed: $(tail -5 "$RUNNER_TEMP/seed.log" | tr '\n' ' ')"
            hdiutil detach .cache/firmware/target-volumes/os-mount -force || true
            exit 1
          }
          # Owner policies for the verified-root chain, both signed by one generated key.
          WORK=out/munch/ipados-17.7.11-21H461/munch
          python3 "$GITHUB_WORKSPACE/scripts/build-root-policy.py" --component os \
            --dmg "$OS_DMG" --out "$WORK/tree/build/verified-root-os" \
            --expected-sha256 3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d \
            --expected-blocks 1483785 --expected-uuid 04769D26-2CA0-4825-B443-E2E5F88300F2 \
            --mountpoint .cache/firmware/target-volumes/os-mount --image-source disk \
            2>&1 | tee "$RUNNER_TEMP/policy-os.log" || {
            echo "::error::OS policy failed: $(tail -5 "$RUNNER_TEMP/policy-os.log" | tr '\n' ' ')"
            hdiutil detach .cache/firmware/target-volumes/os-mount -force || true
            exit 1
          }
          python3 "$GITHUB_WORKSPACE/scripts/build-root-policy.py" --component systemos \
            --dmg out/ipsw/21H461/044-76034-038.dmg --out "$WORK/tree/build/verified-root-systemos" \
            --expected-sha256 b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f \
            --expected-blocks 806400 --image-source file \
            2>&1 | tee "$RUNNER_TEMP/policy-systemos.log" || {
            echo "::error::SystemOS policy failed: $(tail -5 "$RUNNER_TEMP/policy-systemos.log" | tr '\n' ' ')"
            hdiutil detach .cache/firmware/target-volumes/os-mount -force || true
            exit 1
          }
          hdiutil detach .cache/firmware/target-volumes/os-mount -force || true
          # drivers/DarwinBoot comes from the checkout's recursive submodules.
          mkdir -p build
          # The fixture writes a raw APFS container; grow needs the packed form.
          python3 "$GITHUB_WORKSPACE/scripts/pack-data-seed.py" \
            build/owner-data-fixture/owner-data-32.cdr \
            build/owner-data-fixture/owner-data-32.dbr
          python3 scripts/seed-data-grow.py --gib 3 \
            build/owner-data-fixture/owner-data-32.dbr \
            build/owner-data-fixture/owner-data-3.dbr \
            2>&1 | tee "$RUNNER_TEMP/grow.log" || {
            echo "::error::seed grow failed: $(tail -5 "$RUNNER_TEMP/grow.log" | tr '\n' ' ')"
            exit 1
          }

      - name: Pin the Data seed UUID
        if: ${{ !(inputs.steps == 'kernel' || inputs.steps == 'firmware') }}
        working-directory: UniXNU
        run: |
          UUID=$(python3 -c "import json;print(json.load(open('build/owner-data-fixture/seed.json'))['volume_uuid'])")
          echo "Data seed volume UUID: $UUID"
          python3 - "$GITHUB_WORKSPACE/device/configs/munch_defconfig" "$UUID" <<'PY'
          import re, sys
          path, uuid = sys.argv[1], sys.argv[2]
          text = open(path).read()
          text, count = re.subn(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=.*$',
                                f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{uuid}"', text, flags=re.M)
          if count != 1:
              raise SystemExit('expected exactly one CONFIG_XNU_OWNER_DATA_VOLUME_UUID line')
          open(path, 'w').write(text)
          PY
          # The kernel bakes the UUID in, so re-resolve the configuration.
          ./unixnu defconfig munch_defconfig -D "$GITHUB_WORKSPACE/device"

      - name: Free the IPSW
        if: always()
        run: |
          rm -f UniXNU/out/ipsw/*/*.dmg || true
          if [ "$WANT_USERDATA" != "true" ]; then
            rm -f UniXNU/.cache/firmware/target-volumes/*.dmg || true
          fi

      - name: Build kernel
        if: ${{ inputs.steps != 'firmware' }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # build-boot-progress.py needs Font.h; the preflight of the display audit
          # reads the checkout through the same variable.
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
          # Adreno650 is not a UniXNU component: the driver and its kit are submodules of
          # the device repository, and build-adreno650.py takes them from these paths.
          ADRENO650_DRIVER: ${{ github.workspace }}/device/drivers/Adreno650
          ADRENO650_KITS: ${{ github.workspace }}/device/kits
          ADRENO650_PACKAGE: ${{ github.workspace }}/UniXNU/out/munch/ipados-17.7.11-21H461/munch/tree/kits/munch
        run: |
          set -o pipefail
          bash "$GITHUB_WORKSPACE/scripts/steps/build-kernel.sh" "$GITHUB_WORKSPACE/UniXNU" "$GITHUB_WORKSPACE/device" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/device-bootstrap" 2>&1 | tee "$RUNNER_TEMP/kernel.log"

      - name: Build package
        working-directory: UniXNU
        id: package
        run: |
          set -o pipefail
          ./unixnu build package 2>&1 | tee "$RUNNER_TEMP/package.log"

      - name: Build firmware
        working-directory: UniXNU
        id: firmware
        env:
          # check-munch.py runs as a preflight script and reads this variable.
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          set -o pipefail
          ./unixnu build firmware --uefi "$GITHUB_WORKSPACE/uefi" 2>&1 | tee "$RUNNER_TEMP/firmware.log"

      - name: Build payload
        if: ${{ !(inputs.steps == 'kernel' || inputs.steps == 'firmware') }}
        id: payload
        working-directory: UniXNU
        env:
          # patch-xnu-entry-probe.py reads Font.h from this checkout for the panic screen.
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          set -o pipefail
          CHIP_ID=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/config/unique-chip-id.txt")
          ./unixnu build payload \
            --unique-chip-id "$CHIP_ID" \
            --trust-cache build/original-static-system-trust/original-static-system.bundle \
            --data-ramdisk build/owner-data-fixture/owner-data-3.dbr \
            --skip-setup \
            2>&1 | tee "$RUNNER_TEMP/payload.log"

      - name: Build the boot image
        if: ${{ success() && !cancelled() && (github.event_name == 'push' || inputs.steps == 'all' || inputs.steps == 'boot-image') }}
        id: boot
        working-directory: UniXNU
        run: |
          set -o pipefail
          ./unixnu bootimg \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --dtb "$GITHUB_WORKSPACE/uefi/Resources/DTBs/munch.dtb" \
            2>&1 | tee "$RUNNER_TEMP/bootimg.log"

      - name: Build userdata
        if: ${{ env.WANT_USERDATA == 'true' }}
        working-directory: UniXNU
        run: |
          df -h "$GITHUB_WORKSPACE"
          ./unixnu build userdata

      - name: Collect outputs
        if: always()
        working-directory: UniXNU
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if [ -d out ]; then
            extra=()
            if [ "$WANT_USERDATA" = "true" ]; then
              extra=(-o -name 'userdata-root.img' -o -name 'userdata-root.json')
            fi
            files=$(find out -maxdepth 6 -type f \( \
                -name 'boot.img' -o -name 'boot.json' \
                -o -name 'payload.img' -o -name 'payload.json' \
                -o -name 'kernel.macho' -o -name 'kernel.macho.adt' \
                -o -name 'SILICIUM_UEFI.fd' \
                -o -name '*.log' "${extra[@]}" \) || true)
            if [ -n "$files" ]; then
              rsync -R $files "$GITHUB_WORKSPACE/artifacts/"
            fi
          fi
          cp "$GITHUB_WORKSPACE/status.json" "$GITHUB_WORKSPACE/artifacts/" || true
          # The firmware volume is built inside the Mu-Silicium checkout, not under out/.
          fd=$(find "$GITHUB_WORKSPACE/uefi/Build" -name 'SILICIUM_UEFI.fd' 2>/dev/null | head -n 1)
          if [ -n "$fd" ]; then rsync -R "$fd" "$GITHUB_WORKSPACE/artifacts/"; fi
          ls -lR "$GITHUB_WORKSPACE/artifacts" | head -100

      - name: Save the source cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('device/unixnu.lock') }}-${{ github.run_id }}

      - name: Save the kernel build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: UniXNU/out/munch/ipados-17.7.11-21H461/munch/tree/build
          key: kbuild-${{ hashFiles('device/unixnu.lock', 'device/board.toml', 'device/configs/munch_defconfig') }}-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 14
          if-no-files-found: warn

      - name: Show the last log lines in the run summary
        if: always()
        run: |
          {
            echo "## munch build ${{ github.run_number }}"
            echo
            for log in $(find UniXNU/out -name '*.log' -size -2M 2>/dev/null | sort | tail -n 6); do
              echo "### \`$log\`"
              echo '```'
              tail -n 60 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ !cancelled() && (github.event_name == 'push' || (inputs.release && (inputs.steps == 'all' || inputs.steps == 'boot-image'))) }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: munch build ${{ github.run_number }}
          body: |
            Redmi K40S (munch) images from run ${{ github.run_number }}.

            These files contain material derived from Apple's iPadOS restore image
            (kernel prelink, trust cache, Data seed, userdata). Keep this
            repository private and do not redistribute them.

            Read `docs/03-real-device-test.md` before flashing.
          files: |
            ${{ github.workspace }}/artifacts/**/*.img
            ${{ github.workspace }}/artifacts/**/*.fd
            ${{ github.workspace }}/artifacts/**/*.macho
            ${{ github.workspace }}/artifacts/**/*.adt
            ${{ github.workspace }}/artifacts/**/*.json
          fail_on_unmatched_files: false

      - name: Write the run log
        if: always()
        continue-on-error: true
        env:
          KERNEL: ${{ steps.kernel.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          FIRMWARE: ${{ steps.firmware.outcome }}
          PAYLOAD: ${{ steps.payload.outcome }}
          BOOT: ${{ steps.boot.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          {
            echo "run=$GITHUB_RUN_NUMBER attempt=$GITHUB_RUN_ATTEMPT ref=$GITHUB_REF"
            echo "steps: kernel=$KERNEL package=$PACKAGE firmware=$FIRMWARE payload=$PAYLOAD boot=$BOOT"
            echo
            echo "== df"
            df -h "$GITHUB_WORKSPACE" || true
            echo
            echo "== status.json"
            head -c 4000 "$GITHUB_WORKSPACE/status.json" 2>/dev/null || true
            echo
            echo "== driver step logs (out/<device>/<os>/<config>/logs)"
            for f in $(find UniXNU/out -path '*/logs/*.log' 2>/dev/null | sort); do
              echo
              echo "== $f"
              tail -n 250 "$f"
            done
            echo
            echo "== three most recently modified logs anywhere under out/"
            for f in $(find UniXNU/out -name '*.log' 2>/dev/null -printf '%T@ %p\n' | sort -n | tail -n 3 | cut -d' ' -f2-); do
              echo
              echo "== $f (last modified)"
              tail -n 120 "$f"
            done
            echo
            echo "== step logs captured by the pipeline"
            for f in "$RUNNER_TEMP"/*.log; do
              [ -f "$f" ] || continue
              echo
              echo "== $f"
              tail -n 80 "$f"
            done
          } > "$RUNNER_TEMP/record/summary.txt" 2>&1 || true
          echo "wrote $(wc -c < "$RUNNER_TEMP/record/summary.txt") bytes"

      - name: Publish the run log
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RUN_LOG: ${{ runner.temp }}/record/summary.txt
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.RUN_LOG, 'utf8');
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'runs/last-summary.txt',
              message: `run ${context.runNumber} summary`,
              content: Buffer.from(content).toString('base64'),
              branch: context.payload.repository.default_branch,
            };
            try {
              const { data } = await github.rest.repos.getContent({
                owner: params.owner, repo: params.repo, path: params.path, ref: params.branch,
              });
              params.sha = data.sha;
            } catch (error) {
              core.info('no previous summary: ' + error.status);
            }
            await github.rest.repos.createOrUpdateFileContents(params);
            core.info(`published ${content.length} bytes`);
